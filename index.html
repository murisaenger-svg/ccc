<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lenda do Coração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: palco de jogo com proporção retrato; HUD e diálogo dentro do palco, controles touch numa camada própria. */
:root {
  --ink: #140f24;
  --panel: #1f1740;
  --panel-2: #2d2358;
  --line: #5a49a8;
  --text: #fbf1dd;
  --muted: #b9abdc;
  --rose: #ff5d8f;
  --gold: #ffd166;
  --mint: #5de0a5;
  --sky: #6ec8ff;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--font-body); }
body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; }
#app { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 0%, #2a1f5c 0%, #140f24 60%) , var(--ink); overflow: hidden; }
#stage { position: absolute; background: #000; overflow: hidden; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--line), 0 20px 60px rgba(0,0,0,.6); z-index: 1; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 3; }
#hearts { display: flex; flex-wrap: wrap; gap: 2px; max-width: 58%; filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
#hearts img { width: 22px; height: 20px; image-rendering: pixelated; display: block; }
#hudr { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
#frags { display: flex; gap: 4px; padding: 4px 6px; background: rgba(20,15,36,.72); border-radius: 6px; }
#frags img { width: 16px; height: 16px; image-rendering: pixelated; }
#keys { font-family: var(--font-display); font-size: 9px; padding: 6px 7px; background: rgba(20,15,36,.72); border-radius: 6px; color: var(--gold); display: none; }
#menuBtn { width: 38px; height: 38px; border: 0; border-radius: 8px; background: rgba(20,15,36,.78); box-shadow: inset 0 0 0 2px var(--line); font-size: 18px; cursor: pointer; line-height: 1; }
#menuBtn:active { transform: translateY(1px); }
#banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-family: var(--font-display); font-size: 12px; line-height: 1.7; color: var(--text); text-shadow: 0 3px 0 #000, 0 0 14px rgba(255,93,143,.7); letter-spacing: .5px; opacity: 0; pointer-events: none; z-index: 4; padding: 0 14px; }
#banner small { display: block; font-family: var(--font-body); font-size: 15px; color: var(--gold); margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
#banner.show { animation: bannerIn 3s ease both; }
@keyframes bannerIn { 0% { opacity: 0; transform: translateY(10px) scale(.96); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
#bossbar { position: absolute; left: 14px; right: 14px; top: 44px; z-index: 3; display: none; pointer-events: none; }
#bossbar .n { font-family: var(--font-display); font-size: 8px; text-align: center; margin-bottom: 4px; color: var(--text); text-shadow: 0 2px 0 #000; }
#bossbar .bar { height: 10px; background: #2a0f1d; border-radius: 3px; box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--rose); overflow: hidden; }
#bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff8fb0, #e0345f); transition: width .2s; }
#toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%) translateY(-10px); background: var(--panel); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); padding: 8px 14px; border-radius: 4px; font-size: 15px; color: var(--gold); opacity: 0; transition: .25s; z-index: 6; white-space: nowrap; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* Diálogo */
#dlg { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; display: none; }
#dlg.on { display: block; animation: dlgIn .18s ease-out; }
@keyframes dlgIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
#dlg .box { position: relative; background: var(--panel); border-radius: 6px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--line), 0 10px 30px rgba(0,0,0,.5); padding: 14px 14px 18px; min-height: 96px; display: flex; gap: 12px; }
#dlg .por { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 6px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); display: none; align-items: center; justify-content: center; }
#dlg .por canvas { width: 48px; height: 48px; image-rendering: pixelated; }
#dlg .main { flex: 1; min-width: 0; }
#dlg .who { font-family: var(--font-display); font-size: 9px; color: var(--gold); margin-bottom: 8px; letter-spacing: .5px; }
#dlg .txt { font-size: 19px; line-height: 1.32; min-height: 50px; white-space: pre-wrap; }
#dlg .next { position: absolute; right: 12px; bottom: 6px; font-size: 12px; color: var(--rose); animation: bob 0.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
#dlg .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.chbtn { text-align: left; padding: 10px 12px; font-size: 17px; background: var(--panel-2); border: 0; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; }
.chbtn:active, .chbtn:hover { background: #3b2f78; box-shadow: inset 0 0 0 2px var(--rose); }

/* Controles touch */
#ctl { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none; }
#app.touch #ctl { display: block; }
#joyZone { position: absolute; left: 0; top: 0; width: 56%; height: 100%; pointer-events: auto; }
#ctl.off #joyZone { pointer-events: none; }
#joyRing { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 3px rgba(255,255,255,.28); opacity: .0; transition: opacity .15s; pointer-events: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.38); box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.55); }
#joyHint { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(46px + env(safe-area-inset-bottom, 0px)); width: 100px; height: 100px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.14); background: rgba(255,255,255,.04); pointer-events: none; }
#joyHint::after { content: "✥"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: rgba(255,255,255,.28); }
.abtn { position: absolute; border: 0; border-radius: 50%; pointer-events: auto; font-family: var(--font-display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); cursor: pointer; touch-action: none; }
.abtn:active, .abtn.down { transform: translateY(3px) scale(.97); }
#btnA { width: 78px; height: 78px; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); font-size: 22px; background: radial-gradient(circle at 35% 30%, #ff9bb9, #e0345f); box-shadow: 0 5px 0 #8f1e3d, 0 8px 14px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.35); }
#btnB { width: 62px; height: 62px; right: calc(max(22px, env(safe-area-inset-right, 0px)) + 88px); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); font-size: 18px; background: radial-gradient(circle at 35% 30%, #8fe3ff, #2d83d6); box-shadow: 0 5px 0 #1b4f8c, 0 8px 14px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.35); }
.abtn small { display: block; font-family: var(--font-body); font-size: 11px; margin-top: 2px; letter-spacing: 1px; opacity: .9; }
#kbHint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 14px; color: var(--muted); display: none; pointer-events: none; }
#app:not(.touch) #kbHint { display: block; }

/* Camadas globais */
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 30; }
#fade.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(10,6,24,.82); padding: 14px max(14px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); }
#modal.on { display: flex; animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.card { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 8px; padding: 18px 16px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--line), 0 20px 50px rgba(0,0,0,.6); }
.card h2 { font-family: var(--font-display); font-size: 12px; line-height: 1.6; margin: 0 0 12px; color: var(--gold); text-align: center; font-weight: 400; }
.card p { font-size: 18px; line-height: 1.35; margin: 0 0 12px; }
.card .sub { color: var(--muted); font-size: 15px; text-align: center; }
.btn { display: block; width: 100%; padding: 13px 12px; margin-top: 8px; border: 0; border-radius: 6px; font-size: 19px; font-weight: 600; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; }
.btn:active { transform: translateY(1px); }
.btn.pri { background: linear-gradient(#ff7aa2, #e0345f); box-shadow: inset 0 0 0 2px #ffc2d4, 0 4px 0 #8f1e3d; }
.btn.gold { background: linear-gradient(#ffe08a, #f0b429); color: #3a2a00; box-shadow: inset 0 0 0 2px #fff3c4, 0 4px 0 #9a6b00; }
.btn[disabled] { opacity: .45; }
.row { display: flex; gap: 8px; }
.row .btn { margin-top: 8px; }

/* Título */
#title { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
#title canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#title .in { position: relative; z-index: 2; width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; }
#title .kicker { font-family: var(--font-display); font-size: 9px; letter-spacing: 3px; color: var(--gold); margin-bottom: 14px; text-shadow: 0 2px 0 #000; }
#title h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 7vw, 30px); line-height: 1.5; margin: 0; color: var(--text); text-shadow: 0 4px 0 #8f1e3d, 0 8px 0 #000, 0 0 30px rgba(255,93,143,.6); }
#title h1 em { font-style: normal; color: var(--rose); display: block; }
#title .tag { margin: 18px 0 22px; font-size: 18px; color: var(--muted); }
#title label { font-size: 15px; color: var(--muted); align-self: stretch; text-align: left; margin-bottom: 4px; }
#title input { width: 100%; padding: 13px 12px; font-size: 20px; font-family: var(--font-body); background: var(--panel); color: var(--text); border: 0; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line); outline: none; text-align: center; }
#title input:focus-visible { box-shadow: inset 0 0 0 2px var(--rose); }
#title .btn { max-width: 380px; }
#title .tip { margin-top: 16px; font-size: 14px; color: var(--muted); line-height: 1.4; }
#title .duo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
#title .duo img { width: 76px; height: 76px; image-rendering: pixelated; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); }
#title .duo span { color: var(--rose); font-size: 26px; text-shadow: 0 3px 0 #000; }
#tapStart { font-family: var(--font-display); font-size: 11px; color: var(--text); animation: blink 1.1s steps(2) infinite; margin-top: 30px; }
@keyframes blink { 50% { opacity: .15; } }

/* Minigames */
.bar-wrap { position: relative; height: 38px; background: #0e0a1e; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; margin: 14px 0; }
.bar-zone { position: absolute; top: 0; bottom: 0; background: rgba(93,224,165,.55); box-shadow: inset 0 0 0 2px var(--mint); }
.bar-cur { position: absolute; top: 0; bottom: 0; width: 8px; background: var(--rose); box-shadow: 0 0 10px var(--rose); }
.pips { display: flex; justify-content: center; gap: 8px; margin: 6px 0 10px; font-size: 26px; }
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.mem-card { aspect-ratio: 1; border: 0; border-radius: 8px; background: linear-gradient(145deg, #4b3d8f, #2d2358); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 #130c2e; font-size: 30px; display: grid; place-items: center; cursor: pointer; transition: transform .25s; }
.mem-card.open { background: #fbf1dd; transform: rotateY(0deg) scale(1.04); box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 #130c2e; }
.mem-card.done { background: #5de0a5; box-shadow: inset 0 0 0 2px #fff, 0 3px 0 #1b6b4a; }
.mem-card:not(.open):not(.done)::after { content: "♥"; font-size: 22px; color: rgba(255,255,255,.28); }
.mem-card.open::after, .mem-card.done::after { content: none; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.keypad button { padding: 14px 0; font-family: var(--font-display); font-size: 16px; background: var(--panel-2); border: 0; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 #130c2e; cursor: pointer; }
.keypad button:active { transform: translateY(2px); }
.code-disp { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.code-disp span { width: 46px; height: 58px; display: grid; place-items: center; background: #0e0a1e; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line); font-family: var(--font-display); font-size: 22px; color: var(--gold); }
.opt { display: block; width: 100%; text-align: left; padding: 12px; margin-top: 8px; font-size: 18px; background: var(--panel-2); border: 0; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; line-height: 1.25; }
.opt.ok { background: #1f6b4a; box-shadow: inset 0 0 0 2px var(--mint); }
.opt.bad { background: #6b1f3b; box-shadow: inset 0 0 0 2px var(--rose); }
.photo { margin: 0 auto 12px; width: min(300px, 100%); padding: 10px 10px 36px; background: #fbf1dd; border-radius: 3px; box-shadow: 0 8px 20px rgba(0,0,0,.5); transform: rotate(-1.5deg); color: #3b2a22; text-align: center; font-size: 16px; }
.photo .pic { aspect-ratio: 1; background: linear-gradient(135deg, #ffb3c8, #ffd9a0 55%, #a8e6ff); display: grid; place-items: center; font-size: 64px; overflow: hidden; }
.photo .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .cap { margin-top: 10px; font-weight: 600; }
.letter { background: #fbf1dd; color: #3b2a22; border-radius: 4px; padding: 18px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 19px; line-height: 1.4; max-height: 62vh; overflow: auto; }
.letter p { margin: 0 0 10px; }
.letter .sig { text-align: right; font-weight: 700; color: #b0254f; }
.diary h3 { font-family: var(--font-display); font-weight: 400; font-size: 9px; color: var(--rose); margin: 14px 0 6px; letter-spacing: .5px; }
.diary li { font-size: 17px; line-height: 1.3; margin: 0 0 6px; }
.diary ul { margin: 0; padding-left: 20px; }
.diary .done { color: var(--muted); text-decoration: line-through; }

/* Créditos e final */
#credits { position: fixed; inset: 0; z-index: 25; background: #07040f; display: none; overflow: hidden; }
#credits.on { display: block; }
#credits canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#credits .scroll { position: absolute; left: 0; right: 0; top: 100%; text-align: center; padding: 0 20px; z-index: 2; will-change: transform; }
#credits h3 { font-family: var(--font-display); font-weight: 400; font-size: 11px; color: var(--gold); margin: 46px 0 14px; letter-spacing: 2px; line-height: 1.6; }
#credits p { font-size: 20px; margin: 0 0 8px; color: var(--text); line-height: 1.3; }
#credits .big { font-family: var(--font-display); font-size: 18px; line-height: 1.7; color: var(--rose); text-shadow: 0 3px 0 #000; margin: 60px 0 20px; }
#credits .end { position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 3; display: none; padding: 0 20px; }
#credits .end.on { display: block; animation: fadeIn 1s both; }
@media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; } #tapStart { animation: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="176" height="256"></canvas>
    <div id="hud">
      <div id="hearts" aria-label="Vida"></div>
      <div id="hudr">
        <div id="keys"></div>
        <div id="frags" aria-label="Fragmentos do Coração"></div>
        <button id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
    <div id="bossbar"><div class="n"></div><div class="bar"><i></i></div></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="dlg">
      <div class="box">
        <div class="por"><canvas width="48" height="48"></canvas></div>
        <div class="main"><div class="who"></div><div class="txt"></div><div class="choices"></div></div>
        <div class="next">▼</div>
      </div>
    </div>
  </div>
  <div id="ctl">
    <div id="joyZone"><div id="joyRing"><div id="joyKnob"></div></div></div>
    <div id="joyHint"></div>
    <button class="abtn" id="btnB" aria-label="Espada">B<small>ESPADA</small></button>
    <button class="abtn" id="btnA" aria-label="Agir">A<small>AGIR</small></button>
  </div>
  <div id="kbHint">Setas ou WASD: andar · Espaço: falar/agir · J: espada · Esc: menu</div>
</div>

<div id="modal"></div>
<div id="credits"><canvas></canvas><div class="scroll"></div><div class="end"></div></div>
<div id="title">
  <canvas></canvas>
  <div class="in"></div>
</div>
<div id="fade"></div>
<script>
/* =====================================================================
   A LENDA DO CORAÇÃO — jogo de aventura em HTML5 (canvas + WebAudio)
   ---------------------------------------------------------------------
   PERSONALIZE AQUI: tudo que aparece com nome, datas, memórias, quiz,
   carta e pedido final está neste bloco CONFIG. O resto do código não
   precisa ser tocado.
   Dentro dos textos, use {nome} (nome dela) e {eu} (seu nome).
   ===================================================================== */
const CONFIG = {
  /* Aparência da heroína (combine com a dela!) */
  hero: { name: '', skin: '#f2c6a0', hair: '#5b3a29', outfit: '#2e9e5b', style: 'long' }, // style: 'long' | 'short'
  /* Seu personagem (aparece no final) */
  you: { name: 'Muriel', skin: '#e8b88f', hair: '#2b1d14', outfit: '#3a6fd8', style: 'short' },

  /* Código secreto da Porta do Coração (4 números): dia e mês em que o namoro começou (DDMM) = 23/08 */
  secretCode: '2308',
  codeHint: 'o dia e o mês em que nossa história começou (4 números: DDMM)',

  /* Memórias reveladas nas Estátuas da Montanha das Saudades. Cole uma URL de foto em "photo" se quiser. */
  memories: [
    { title: 'O Começo', text: 'Eu ainda lembro de como meu coração disparou quando te vi pela primeira vez. Nenhum chefão me deixou tão nervoso.', photo: '', emoji: '✨' },
    { title: 'Nosso Primeiro Passeio', text: 'Aquele dia em que o tempo voou e eu só queria que a tarde não acabasse nunca.', photo: '', emoji: '🌅' },
    { title: 'Nossas Risadas', text: 'O som da sua risada é a melhor trilha sonora que eu já ouvi. E olha que eu entendo de trilha sonora.', photo: '', emoji: '😂' }
  ],

  /* Quiz do Show do Milhão do Amor (precisa acertar 3 de 5). ok = índice da resposta certa (começa em 0) */
  quiz: [
    { q: 'Qual é a melhor parte do dia?', opts: ['Dormir até tarde', 'Comer', 'Ficar com {eu}', 'Ver série sem ninguém falando'], ok: 2, right: 'Resposta de quem tem bom gosto!', wrong: 'Interessante... mas a certa era ficar com {eu}. 😏' },
    { q: 'Quem tem o sorriso mais bonito do reino?', opts: ['O Rei da Preguiça', '{nome}', 'O Prefeito Bigodão', 'O pombo da praça'], ok: 1, right: 'Óbvio! O reino inteiro concorda.', wrong: 'Errou feio. A resposta é {nome}, claro.' },

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, gg = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); gg = Math.max(0, Math.min(255, gg)); b = Math.max(0, Math.min(255, b));
  return '#' + ((1 << 24) + (r << 16) + (gg << 8) + b).toString(16).slice(1);
}
function drawChar(g, ox, oy, d, f, o) {

    P(5, 13 - up1, 3, 1, shoe); P(9, 13 - up2, 3, 1, shoe);

  } else {

function heartURL(kind) {
  const full = { a: '#7a1030', b: '#ff4d7d' }, empty = { a: '#3a2a4a', b: '#1c1430' };
  const g = mkCanvas(8, 7), x = g.getContext('2d');
  const draw = (pal, clipX) => {
    for (let y = 0; y < 7; y++) for (let i = 0; i < 8; i++) { if (i >= clipX[0] && i < clipX[1]) { const k = HEART_MASK[y][i]; if (pal[k]) { x.fillStyle = pal[k]; x.fillRect(i, y, 1, 1); } } }
  };
  if (kind === 'full') draw(full, [0, 8]);
  else if (kind === 'half') { draw(empty, [0, 8]); draw(full, [0, 4]); }
  else draw(empty, [0, 8]);
  if (kind !== 'empty') { x.fillStyle = '#ffd0de'; x.fillRect(1, 1, 1, 1); }
  return g.toDataURL();
}
function gemURL(on, hue) {
  const m = ['..aa..', '.abba.', 'abccba', 'abbbba', '.abba.', '..aa..'];
  const pal = on ? { a: '#fff', b: hue, c: '#ffffff' } : { a: '#3a2a4a', b: '#1c1430', c: '#2a2040' };
  return pixelIcon(m, pal, 2).toDataURL();
}

/* ---------- partículas ---------- */
const FX = [];
function fx(o) { FX.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: .6, t: 0, size: 2, color: '#fff', g: 0, kind: 'sq' }, o)); }
function burst(x, y, n, colors, spd = 40, life = .5, size = 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = spd * (.4 + Math.random() * .8);
    fx({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (.6 + Math.random() * .6), size, color: colors[(Math.random() * colors.length) | 0], g: 30 });
  }
}
function updateFX(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const p = FX[i]; p.t += dt;
    if (p.t >= p.life) { FX.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
  }
}
function drawHeartShape(g, x, y, s, c) {
  g.fillStyle = c;
  g.fillRect(x - s, y - s, s, s); g.fillRect(x + 1, y - s, s, s);
  g.fillRect(x - s, y, s * 2 + 1, s); g.fillRect(x - s + 1, y + s, s * 2 - 1, 1); g.fillRect(x - 1, y + s + 1, 3, 1);
}
function drawFX(g, camx, camy) {
  for (const p of FX) {
    const k = 1 - p.t / p.life, x = Math.round(p.x - camx), y = Math.round(p.y - camy);
    g.globalAlpha = Math.max(0, Math.min(1, k * 1.4));
    if (p.kind === 'heart') drawHeartShape(g, x, y, p.size, p.color);
    else if (p.kind === 'star') { g.fillStyle = p.color; g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); }
    else if (p.kind === 'text') { g.fillStyle = p.color; g.font = '8px "Pixelify Sans", monospace'; g.fillText(p.text, x, y); }
    else { g.fillStyle = p.color; g.fillRect(x, y, p.size, p.size); }
  }
  g.globalAlpha = 1;
}

const Art = { hero: null, you: null, heroPortrait: null, youPortrait: null, heroURL: '', youURL: '', ready: null };

function artFrames(img, dir) {
  const c0 = mkCanvas(32, 32), x0 = c0.getContext('2d'); x0.drawImage(img, 0, 0);
  const d = x0.getImageData(0, 0, 32, 32).data; let bb = 31;
  while (bb > 0) { let any = false; for (let x = 0; x < 32; x++) if (d[(bb * 32 + x) * 4 + 3] > 0) { any = true; break; } if (any) break; bb--; }
  const out = [c0], fh = 3, split = bb - fh + 1;
  for (const k of [0, 1]) {
    const c = mkCanvas(32, 32), g2 = c.getContext('2d'); g2.imageSmoothingEnabled = false;
    g2.drawImage(img, 0, 0, 32, split, 0, 0, 32, split);
    if (dir === 'down' || dir === 'up') {
      const lift = k === 0 ? 0 : 16, plant = k === 0 ? 16 : 0;
      g2.drawImage(img, plant, split, 16, fh, plant, split, 16, fh);
      g2.drawImage(img, lift, split, 16, fh, lift, split - 2, 16, fh);
      g2.drawImage(img, lift, split - 1, 16, 1, lift, split - 1, 16, 1);
    } else {
      const dx = k === 0 ? 1 : -1;
      g2.drawImage(img, 0, split, 16, fh, dx, split, 16, fh);
      g2.drawImage(img, 16, split, 16, fh, 16 - dx, split, 16, fh);
    }
    out.push(c);
  }
  return out;
}
function makeArtSheet(imgs) {
  const sheet = mkCanvas(96, 128), g2 = sheet.getContext('2d');
  ['down', 'left', 'right', 'up'].forEach((dir, di) => artFrames(imgs[dir], dir).forEach((fr, f) => g2.drawImage(fr, f * 32, di * 32)));
  sheet.u = 32; return sheet;
}
function portraitFrom(img) { const c = mkCanvas(32, 32); c.getContext('2d').drawImage(img, 0, 0); c.portrait = true; return c; }
Art.ready = (async () => {
  const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  try {
    const keys = Object.keys(ART_SRC), imgs = {};
    await Promise.all(keys.map(async k => { imgs[k] = await load(ART_SRC[k]); }));
    if (keys.some(k => !imgs[k])) return;
    const pick = p => ({ down: imgs[p + '_down'], up: imgs[p + '_up'], left: imgs[p + '_left'], right: imgs[p + '_right'] });
    Art.hero = makeArtSheet(pick('hero')); Art.you = makeArtSheet(pick('you'));
    Art.heroPortrait = portraitFrom(imgs.hero_menu); Art.youPortrait = portraitFrom(imgs.you_menu);
    Art.heroURL = ART_SRC.hero_menu; Art.youURL = ART_SRC.you_menu;
  } catch (e) { console.error(e); }
})();

/* ---------- entrada ---------- */
const Input = {
  kb: {}, joy: { x: 0, y: 0 }, aq: false, bq: false,
  vec() {
    let x = this.joy.x, y = this.joy.y;
    if (this.kb.left) x -= 1; if (this.kb.right) x += 1; if (this.kb.up) y -= 1; if (this.kb.down) y += 1;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return { x, y };
  },
  takeA() { const v = this.aq; this.aq = false; return v; },
  takeB() { const v = this.bq; this.bq = false; return v; }
};
const UI = { modalOpen: 0, modalA: null };

function pressA() {

}

const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT')) return;
  const k = KEYMAP[e.key];
  if (k) { Input.kb[k] = true; e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') { pressA(); e.preventDefault(); }
  else if (e.key === 'j' || e.key === 'J' || e.key === 'x' || e.key === 'X' || e.key === 'k' || e.key === 'K') { pressB(); e.preventDefault(); }
  else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (started && !Dlg.active && !UI.modalOpen && !lockCount) openPause(); }
});

(function setupTouch() {
  const zone = $('joyZone'), ring = $('joyRing'), knob = $('joyKnob');
  let id = null, ox = 0, oy = 0;
  const R = 46;
  zone.addEventListener('pointerdown', e => {
    if (id !== null) return;
    id = e.pointerId; ox = e.clientX; oy = e.clientY;
    try { zone.setPointerCapture(id); } catch (er) {}
    ring.style.left = ox + 'px'; ring.style.top = oy + 'px'; ring.style.opacity = '1';
    knob.style.transform = 'translate(0,0)';
    Snd.init();
    e.preventDefault();
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    let dx = e.clientX - ox, dy = e.clientY - oy; const m = Math.hypot(dx, dy);
    if (m > R) { dx = dx / m * R; dy = dy / m * R; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const mm = Math.min(1, m / R);
    if (m < 8) Input.joy = { x: 0, y: 0 };
    else Input.joy = { x: dx / R * (mm < 1 ? 1 : 1), y: dy / R };
  });
  const end = e => { if (e.pointerId !== id) return; id = null; Input.joy = { x: 0, y: 0 }; ring.style.opacity = '0'; };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  const bind = (el, fn) => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('down'); fn(); });
    const up = () => el.classList.remove('down');
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  };
  bind($('btnA'), pressA); bind($('btnB'), pressB);
  document.addEventListener('contextmenu', e => e.preventDefault());
})();

/* ---------- layout responsivo ---------- */
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer:coarse)').matches;
  $('app').classList.toggle('touch', touch || window.__forceTouch === true);
  const portrait = vh > vw;
  const reserve = touch && portrait ? Math.min(vh * 0.30, 250) : (touch ? 0 : 34);
  const availH = vh - reserve - 8;
  const aspect = clamp(vw / availH, 0.58, 0.82);
  let sw = Math.min(vw - 12, availH * aspect), sh = sw / aspect;
  if (!touch || !portrait) { sh = Math.min(availH, sh); sw = sh * aspect; }
  const st = $('stage');
  st.style.width = sw + 'px'; st.style.height = sh + 'px';
  st.style.left = Math.round((vw - sw) / 2) + 'px';
  st.style.top = (touch && portrait ? 4 : Math.max(4, Math.round((vh - sh) / 2))) + 'px';
  const nh = Math.round(VW / aspect);
  if (nh !== VH || cvs.width !== VW * 2) { VH = nh; cvs.width = VW * 2; cvs.height = VH * 2; lightCv = mkCanvas(VW, VH); g.imageSmoothingEnabled = false; }
  document.documentElement.style.setProperty('--u', (sw / VW) + 'px');
  st.style.fontSize = '16px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------- mapa ---------- */
function gridAt(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= W.w || ty >= W.h) return 'V';
  return W.grid[ty][tx];
}
function blocked(x, y, w, h, self) {
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - .001) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - .001) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (SOLID.has(gridAt(tx, ty))) return true;
  const box = { x, y, w, h };
  for (const e of W.ents) if (e !== self && e.solid && !e.dead && overlap(box, e)) return e;
  return false;
}
function walkable(tx, ty) { return !SOLID.has(gridAt(tx, ty)); }

function loadMap(id, tx, ty, dir) {
  const def = MAPS[id];
  const m = def.build(S);
  W.id = id; W.w = m.w; W.h = m.h;
  W.grid = m.grid.map(r => Array.isArray(r) ? r.slice() : r.split(''));
  W.ents = m.ents || [];
  W.name = def.name; W.sub = def.sub || ''; W.dark = def.dark || 0; W.weather = def.weather || ''; W.music = def.music;
  W.entry = { x: tx, y: ty, dir: dir || 'down' };
  W.cutGrass = {};
  W.time = 0;
  FX.length = 0;
  P.x = tx * TS + 3; P.y = ty * TS + 6; P.dir = dir || 'down'; P.atk = 0; P.kx = P.ky = 0; P.pushT = 0; P.dead = false;
  S.map = id;
  Boss.current = null; $('bossbar').style.display = 'none';
  snapCam();
  if (W.music) Snd.music(Boss.current ? 'boss' : W.music);
}
function snapCam() { cam.focus = null; updateCam(1, true); }

function updateCam(dt, snap) {
  const f = cam.focus;
  let cx = f ? f.x : P.x + P.w / 2, cy = f ? f.y : P.y + P.h / 2 - 6;
  let tx = cx - VW / 2, ty = cy - VH / 2;
  const mx = W.w * TS - VW, my = W.h * TS - VH;
  tx = mx <= 0 ? mx / 2 : clamp(tx, 0, mx);
  ty = my <= 0 ? my / 2 : clamp(ty, 0, my);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { const k = Math.min(1, dt * 7); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; }
}

/* ---------- script helpers ---------- */

/* ---------- save ---------- */
function saveGame() {

  try {
    const o = { name: S.name, hp: S.hp, maxHp: S.maxHp, items: S.items, flags: S.flags, frags: S.frags, keys: S.keys, map: W.id, tx: W.entry.x, ty: W.entry.y, dir: W.entry.dir, play: S.play };

/* ---------- jogador ---------- */
const SPEED = 62;
function stepAxis(dx, dy) {
  if (!dx && !dy) return false;
  const nx = P.x + dx, ny = P.y + dy;
  const b = blocked(nx, ny, P.w, P.h, P);
  if (!b) { P.x = nx; P.y = ny; return true; }
  if (b !== true && b.onPush && P.moving) { b.onPush(Math.sign(dx), Math.sign(dy)); P.pushing = true; }
  // deslizar em quinas
  const lim = 4;
  if (dx && !dy) { for (let k = 1; k <= lim; k++) for (const s of [-1, 1]) if (!blocked(nx, P.y + s * k, P.w, P.h, P)) { P.y += s * Math.min(k, .8); return false; } }
  if (dy && !dx) { for (let k = 1; k <= lim; k++) for (const s of [-1, 1]) if (!blocked(P.x + s * k, ny, P.w, P.h, P)) { P.x += s * Math.min(k, .8); return false; } }
  return false;
}
function playerCenter() { return { x: P.x + P.w / 2, y: P.y + P.h / 2 }; }

function hurtPlayer(dmg, fx0, fy0) {
  if (P.inv > 0 || P.dead || S.hp <= 0) return;
  S.hp = Math.max(0, S.hp - dmg);
  P.inv = 1.15; P.flash = .25;
  const c = playerCenter(), a = Math.atan2(c.y - fy0, c.x - fx0);
  P.kx = Math.cos(a) * 120; P.ky = Math.sin(a) * 120;
  Snd.sfx('hurt'); shake(.22);
  burst(c.x, c.y, 6, ['#ff4d7d', '#ffd0de'], 40, .4);
  updateHud();
  if (S.hp <= 0) die();
}
async function die() {
  if (P.dead) return;
  P.dead = true; Input.joy = { x: 0, y: 0 };
  Snd.stop();
  await sleep(450);
  await fade(true);
  S.hp = S.maxHp; updateHud();
  const e = W.entry;
  loadMap(W.id, e.x, e.y, e.dir);
  await fade(false);
  Snd.music(W.music);
  await say('', ['Você desmaiou de saudade...', 'Mas o amor te levantou de novo! Vida recarregada. 💖']);
}

function swordBox() {
  const c = playerCenter();
  switch (P.dir) {
    case 'down': return { x: c.x - 9, y: P.y + P.h - 3, w: 18, h: 14 };
    case 'up': return { x: c.x - 9, y: P.y - 13, w: 18, h: 14 };
    case 'left': return { x: P.x - 13, y: P.y - 7, w: 15, h: 17 };
    default: return { x: P.x + P.w - 2, y: P.y - 7, w: 15, h: 17 };
  }
}
function doSwordHits() {
  const box = swordBox();
  for (const e of W.ents) {
    if (e.dead || !e.hit || e._hitId === P.atkId) continue;
    if (overlap(box, e)) { e._hitId = P.atkId; e.hit(1, P.dir); }
  }
  // grama alta
  const x0 = Math.floor(box.x / TS), x1 = Math.floor((box.x + box.w) / TS), y0 = Math.floor(box.y / TS), y1 = Math.floor((box.y + box.h) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (gridAt(tx, ty) === 'G') {
      W.grid[ty][tx] = '.';
      burst(tx * TS + 8, ty * TS + 8, 7, ['#3fa64a', '#78d070', '#2f8a3b'], 38, .5);
      Snd.sfx('hit');
      if (Math.random() < .22) spawnPickup('heart', tx * TS + 4, ty * TS + 4);
    }
  }
}

function updatePlayer(dt) {
  P.pushing = false;
  if (P.inv > 0) P.inv -= dt;
  if (P.flash > 0) P.flash -= dt;
  // empurrão
  if (Math.abs(P.kx) + Math.abs(P.ky) > 5) {
    stepAxis(P.kx * dt, 0); stepAxis(0, P.ky * dt);
    P.kx *= Math.pow(.0008, dt); P.ky *= Math.pow(.0008, dt);
  } else { P.kx = P.ky = 0; }
  const can = controllable();
  const v = can ? Input.vec() : { x: 0, y: 0 };
  const m = Math.hypot(v.x, v.y);
  P.moving = (m > .12 && P.atk <= 0) || !!P.forceMove;
  if (P.forceMove) P.anim += dt;
  if (P.moving) {
    const sp = SPEED * (m < .6 ? .75 : 1) * dt, nx = v.x / m, ny = v.y / m;
    stepAxis(nx * sp, 0); stepAxis(0, ny * sp);
    if (Math.abs(v.x) > Math.abs(v.y) * 1.15) P.dir = v.x < 0 ? 'left' : 'right';
    else if (Math.abs(v.y) > Math.abs(v.x) * 1.15) P.dir = v.y < 0 ? 'up' : 'down';
    P.anim += dt;
  } else if (P.atk <= 0) P.anim = 0;
  if (!P.pushing) P.pushT = 0;
  if (P.atk > 0) { const before = P.atk; P.atk -= dt; if (before > .17 && P.atk <= .17) doSwordHits(); if (before > .09 && P.atk <= .09) doSwordHits(); }
  if (can) {
    if (Input.takeB()) { if (S.items.sword && P.atk <= 0) { P.atk = .26; P.atkId++; Snd.sfx('sword'); } else if (!S.items.sword) toast('Você ainda não tem uma espada!'); }
    if (Input.takeA()) tryInteract();
  } else { Input.aq = false; Input.bq = false; }
}
function tryInteract() {
  const c = playerCenter();
  const d = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[P.dir];
  const probe = { x: c.x + d[0] * 10 - 5, y: c.y + d[1] * 10 - 5, w: 10, h: 10 };
  let best = null, bd = 1e9;
  for (const e of W.ents) {
    if (e.dead || !e.interact) continue;
    const box = { x: e.x - 2, y: e.y - 2, w: e.w + 4, h: e.h + 4 };
    if (overlap(probe, box)) { const dd = dist(e, { x: probe.x, y: probe.y, w: probe.w, h: probe.h }); if (dd < bd) { bd = dd; best = e; } }
  }
  if (best && !S._busy) { Snd.sfx('select'); S._busy = true; Promise.resolve().then(() => best.interact(best)).catch(console.error).finally(() => { S._busy = false; }); }
}

/* ---------- pickups / loot ---------- */
function spawnPickup(kind, x, y) {
  W.ents.push(makePickup(kind, x, y));
}

/* ---------- loop principal ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
    Dlg.tick(dt);
    if (started) { update(dt); render(); } else if (Title.active) Title.tick(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function update(dt) {
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
  if (frozen()) { updateCam(dt); return; }
  W.time += dt; S.play += dt;
  updatePlayer(dt);
  for (const e of W.ents) if (e.update && !e.dead) e.update(dt);
  for (let i = W.ents.length - 1; i >= 0; i--) if (W.ents[i].dead) W.ents.splice(i, 1);
  // gatilhos
  if (!P.dead) {
    const pb = { x: P.x, y: P.y, w: P.w, h: P.h };
    for (const e of W.ents) if (e.trigger && !e.dead && overlap(pb, e)) e.trigger(e);
  }
  updateFX(dt);
  updateCam(dt);
  updateHud();
  Boss.updateBar();
}

/* ---------- renderização ---------- */
function drawPlayer(g2, cx, cy) {
  if (P.dead) return;
  if (P.inv > 0 && Math.floor(P.inv * 16) % 2 === 0) return;
  const fr = P.moving ? [0, 1, 0, 2][Math.floor(P.anim * 9) % 4] : 0;
  const u = P.sheet.u || 16, sx = fr * u, sy = DIRI[P.dir] * u, hi = u === 32;
  const x = hi ? Math.round((P.x - 3 - cx) * 2) / 2 : Math.round(P.x - 3 - cx);
  const y = hi ? Math.round((P.y - 8 - cy) * 2) / 2 + (P.moving && fr !== 0 ? -.5 : 0) : Math.round(P.y - 8 - cy) + (P.moving && fr !== 0 ? -1 : 0);
  if (hi) shadowAt(g2, P.x + 5 - cx, P.y + 8 - cy, 5);
  if (P.flash > 0) { g2.globalAlpha = .6; }
  // espada atrás do corpo quando virado para cima
  if (P.atk > 0 && P.dir === 'up') drawSword(g2, cx, cy);
  g2.drawImage(P.sheet, sx, sy, u, u, x, y, 16, 16);
  g2.globalAlpha = 1;
  if (P.atk > 0 && P.dir !== 'up') drawSword(g2, cx, cy);
  else if (!P.atk && S.items.sword && P.dir !== 'up') {
    // espada embainhada nas costas
    px(g2, x + (P.dir === 'right' ? 2 : P.dir === 'left' ? 12 : 11), y + 6, 1, 6, '#cfe8ff');
  }
}
function drawSword(g2, cx, cy) {
  const c = playerCenter(), x = c.x - cx, y = c.y - cy - 2;
  const base = { down: Math.PI / 2, up: -Math.PI / 2, left: Math.PI, right: 0 }[P.dir];
  const prog = 1 - clamp(P.atk / .26, 0, 1);
  const a = base + (-1.2 + prog * 2.4) * (P.dir === 'left' || P.dir === 'up' ? -1 : 1);
  g2.save(); g2.translate(Math.round(x), Math.round(y)); g2.rotate(a);
  g2.fillStyle = '#7a4a2a'; g2.fillRect(3, -1, 3, 3);
  g2.fillStyle = '#ffd166'; g2.fillRect(5, -3, 2, 7);
  g2.fillStyle = '#e8f6ff'; g2.fillRect(7, -1, 10, 3);
  g2.fillStyle = '#9fd0f5'; g2.fillRect(7, 1, 10, 1);
  g2.fillStyle = '#fff'; g2.fillRect(17, 0, 2, 1);
  g2.restore();
  // rastro
  g2.globalAlpha = .35; g2.strokeStyle = '#fff'; g2.lineWidth = 2; g2.beginPath();
  g2.arc(Math.round(x), Math.round(y), 15, a - (P.dir === 'left' || P.dir === 'up' ? -.9 : .9), a); g2.stroke(); g2.globalAlpha = 1;
}

function render() {
  g.setTransform(2, 0, 0, 2, 0, 0); g.imageSmoothingEnabled = false;
  const cx = Math.round(cam.x + (shakeT > 0 ? rnd(-2, 2) : 0)), cy = Math.round(cam.y + (shakeT > 0 ? rnd(-2, 2) : 0));
  g.fillStyle = '#05030c'; g.fillRect(0, 0, VW, VH);
  const fr = Math.floor(W.time * 3.2);
  const x0 = Math.max(0, Math.floor(cx / TS)), x1 = Math.min(W.w - 1, Math.floor((cx + VW) / TS));
  const y0 = Math.max(0, Math.floor(cy / TS)), y1 = Math.min(W.h - 1, Math.floor((cy + VH) / TS));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) drawTile(g, W.grid[ty][tx], tx * TS - cx, ty * TS - cy, tx, ty, fr);
  // entidades ordenadas por profundidade
  const list = W.ents.filter(e => !e.dead && e.draw);
  const under = list.filter(e => e.z < 0), over = list.filter(e => e.z >= 0);
  for (const e of under) e.draw(g, cx, cy);
  over.push({ z: 0, y: P.y - 4, h: 12, draw: drawPlayer, isPlayer: true });
  over.sort((a, b) => (a.z - b.z) || ((a.y + a.h) - (b.y + b.h)));
  for (const e of over) e.draw(g, cx, cy);
  drawFX(g, cx, cy);
  drawWeather(g, W.time);
  if (W.dark > 0) drawLights(g, cx, cy);
  if (flashT > 0) { g.globalAlpha = clamp(flashT * 2.5, 0, .7); g.fillStyle = flashColor; g.fillRect(0, 0, VW, VH); g.globalAlpha = 1; }
  if (S.hp > 0 && S.hp <= 2 && !P.dead) { // alerta de pouca vida
    const a = .12 + .1 * Math.sin(performance.now() / 160); g.fillStyle = `rgba(255,40,80,${a})`;
    g.fillRect(0, 0, VW, 3); g.fillRect(0, VH - 3, VW, 3); g.fillRect(0, 0, 3, VH); g.fillRect(VW - 3, 0, 3, VH);
  }
}
function drawWeather(g2, t) {
  const k = W.weather; if (!k) return;
  for (let i = 0; i < 38; i++) {
    const r1 = (hash(i, 11) % 1000) / 1000, r2 = (hash(i, 12) % 1000) / 1000, r3 = (hash(i, 13) % 1000) / 1000;
    let x, y;
    if (k === 'snow') {
      x = ((r1 * VW + Math.sin(t * .9 + i) * 8 + t * (3 + r3 * 5)) % VW + VW) % VW; y = (r2 * VH + t * (16 + r3 * 20)) % VH;
      g2.fillStyle = 'rgba(255,255,255,.85)'; g2.fillRect(Math.round(x), Math.round(y), r3 > .6 ? 2 : 1, r3 > .6 ? 2 : 1);
    } else if (k === 'leaf') {
      x = ((r1 * VW + t * (6 + r3 * 8)) % VW); y = (r2 * VH + t * (10 + r3 * 10) + Math.sin(t + i) * 6) % VH;
      g2.fillStyle = r3 > .5 ? 'rgba(160,220,90,.8)' : 'rgba(230,200,80,.8)'; g2.fillRect(Math.round(x), Math.round(y), 2, 1);
    } else if (k === 'petal') {
      x = ((r1 * VW + t * (8 + r3 * 8) + Math.sin(t * 1.3 + i) * 6) % VW); y = (r2 * VH + t * (12 + r3 * 10)) % VH;
      g2.fillStyle = r3 > .5 ? 'rgba(255,160,190,.9)' : 'rgba(255,220,230,.9)'; g2.fillRect(Math.round(x), Math.round(y), 2, 2);
    } else if (k === 'sparkle') {
      x = r1 * VW; y = ((r2 * VH - t * (6 + r3 * 8)) % VH + VH) % VH;
      const a = .4 + .6 * Math.abs(Math.sin(t * 2 + i)); g2.fillStyle = `rgba(255,230,160,${a})`; g2.fillRect(Math.round(x), Math.round(y), 1, 1);
    } else if (k === 'ember') {
      x = (r1 * VW + Math.sin(t + i) * 6); y = ((r2 * VH - t * (10 + r3 * 14)) % VH + VH) % VH;
      g2.fillStyle = r3 > .5 ? 'rgba(255,150,80,.85)' : 'rgba(255,90,140,.85)'; g2.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
  }
}
function drawLights(g2, cx, cy) {
  const l = lightCv.getContext('2d');
  l.globalCompositeOperation = 'source-over';
  l.clearRect(0, 0, VW, VH);
  l.fillStyle = `rgba(8,5,26,${W.dark})`; l.fillRect(0, 0, VW, VH);
  l.globalCompositeOperation = 'destination-out';
  const light = (x, y, r, a = 1) => {
    const gr = l.createRadialGradient(x, y, r * .15, x, y, r);
    gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = gr; l.fillRect(x - r, y - r, r * 2, r * 2);
  };
  const c = playerCenter(); light(c.x - cx, c.y - cy, 62, 1);
  for (const e of W.ents) if (e.light && !e.dead) light(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy, e.light, .95);
  g2.imageSmoothingEnabled = true; g2.drawImage(lightCv, 0, 0); g2.imageSmoothingEnabled = false;
}

/* ---------- diálogo ---------- */
const Dlg = (() => {
  const el = $('dlg'), whoEl = el.querySelector('.who'), txtEl = el.querySelector('.txt'), chEl = el.querySelector('.choices');
  const por = el.querySelector('.por'), porC = por.querySelector('canvas'), nextEl = el.querySelector('.next');
  const D = { active: false };
  let resolve = null, full = '', idx = 0, acc = 0, typing = false, openedAt = 0, pitch = 1, waitChoice = false, pend = 0;
  const pctx = porC.getContext('2d'); pctx.imageSmoothingEnabled = false;

  function show() { el.classList.add('on'); D.active = true; syncCtl(); Input.joy = { x: 0, y: 0 }; }
  function hide() { el.classList.remove('on'); D.active = false; syncCtl(); }

  function setup(who, opt) {
    const name = who ? T(who) : '';
    whoEl.textContent = name; whoEl.style.display = name ? 'block' : 'none';
    const sheet = (opt && opt.sheet) || Portraits[name];
    if (sheet) { const cw = sheet.portrait ? sheet.width : (sheet.u || 16); pctx.clearRect(0, 0, 48, 48); pctx.drawImage(sheet, 0, 0, cw, cw, 0, 0, 48, 48); por.style.display = 'flex'; } else por.style.display = 'none';
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 997;
    pitch = (opt && opt.pitch) || (name ? .75 + (h % 9) * .07 : .6);
    chEl.innerHTML = ''; waitChoice = false;
  }

  D.say = async function (who, text, opt) {
    const lines = Array.isArray(text) ? text : [text];
    pend++;
    for (const ln of lines) {
      await new Promise(res => {
        setup(who, opt);
        full = T(ln); idx = 0; acc = 0; typing = true; txtEl.textContent = '';
        nextEl.style.display = 'block'; openedAt = performance.now(); resolve = res; show();
      });
    }
    pend--;
    setTimeout(() => { if (!pend && !waitChoice) hide(); }, 40);
  };

  D.ask = function (who, text, options, opt) {
    pend++;
    return new Promise(res => {
      setup(who, opt);
      full = T(text); idx = full.length; typing = false; txtEl.textContent = full; nextEl.style.display = 'none';
      waitChoice = true; openedAt = performance.now(); resolve = null; show();
      options.forEach((o, i) => {
        const b = document.createElement('button'); b.className = 'chbtn'; b.textContent = T(o);
        b.addEventListener('click', () => { if (performance.now() - openedAt < 150) return; Snd.sfx('confirm'); waitChoice = false; chEl.innerHTML = ''; pend--; setTimeout(() => { if (!pend) hide(); }, 40); res(i); });
        chEl.appendChild(b);
      });
    });
  };

  D.advance = function () {
    if (waitChoice) return;
    if (performance.now() - openedAt < 140) return;
    if (typing) { idx = full.length; txtEl.textContent = full; typing = false; return; }
    if (resolve) { const r = resolve; resolve = null; Snd.sfx('select'); r(); }
  };
  D.tick = function (dt) {
    if (!D.active || !typing) return;
    acc += dt * 58;
    let changed = false;
    while (acc >= 1 && idx < full.length) { idx++; acc--; changed = true; if (idx % 3 === 0 && full[idx - 1] !== ' ') Snd.sfx('blip', pitch); }
    if (changed) txtEl.textContent = full.slice(0, idx);
    if (idx >= full.length) typing = false;
  };
  el.addEventListener('pointerdown', e => { if (e.target.closest('.chbtn')) return; e.preventDefault(); D.advance(); });
  return D;
})();
const say = (who, text, opt) => Dlg.say(who, text, opt);
const ask = (who, text, options, opt) => Dlg.ask(who, text, options, opt);

const FISH = ['Peixe Apaixonado', 'Sardinha Romântica', 'Tilápia Fofoqueira', 'Atum de Terno e Gravata', 'Peixe-Espada (versão econômica)', 'Bota Velha (conta como peixe?)', 'Lambari Dançarino'];
function miniFishing() {
  const M = openModal(`<h2>PESCARIA</h2><p class="sub">Toque em PUXAR! quando o marcador estiver na zona verde. Pegue 3 peixes!</p>
    <div class="pips" id="fp"></div><div class="bar-wrap"><div class="bar-zone" id="fz"></div><div class="bar-cur" id="fc"></div></div>
    <p class="sub" id="fm">Aguardando a fisgada...</p>
    <button class="btn pri" id="fgo">PUXAR!</button><button class="btn" id="fx">Desistir</button>`);
  const fz = M.card.querySelector('#fz'), fc = M.card.querySelector('#fc'), fm = M.card.querySelector('#fm'), fp = M.card.querySelector('#fp');
  let pos = 0, dir = 1, caught = 0, speed = 0.8, z0 = .4, zw = .26, raf = 0, last = performance.now(), cool = 0;
  const newZone = () => { zw = Math.max(.14, .27 - caught * .04); z0 = rnd(.08, .92 - zw); fz.style.left = (z0 * 100) + '%'; fz.style.width = (zw * 100) + '%'; };
  const pips = () => { fp.textContent = '🐟'.repeat(caught) + '▫️'.repeat(3 - caught); };
  newZone(); pips();
  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    pos += dir * speed * dt; if (pos > 1) { pos = 1; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
    fc.style.left = `calc(${pos * 100}% - ${pos * 8}px)`;
    if (cool > 0) cool -= dt;
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  const pull = () => {
    if (cool > 0) return; cool = .45;
    if (pos >= z0 && pos <= z0 + zw) {
      caught++; Snd.sfx('fish'); fm.textContent = 'Fisgou: ' + FISH[(Math.random() * FISH.length) | 0] + '!'; pips();
      if (caught >= 3) { cancelAnimationFrame(raf); setTimeout(() => M.close(true), 800); return; }
      speed += .28; newZone();
    } else { Snd.sfx('error'); fm.textContent = ['Escapou!', 'Foi rápido demais!', 'O peixe riu de você.'][(Math.random() * 3) | 0]; }
  };
  M.card.querySelector('#fgo').addEventListener('pointerdown', e => { e.preventDefault(); pull(); });
  UI.modalA = pull;
  M.card.querySelector('#fx').addEventListener('click', () => { cancelAnimationFrame(raf); M.close(false); });
  return M.p;
}

      <button class="btn" id="m">${Snd.isMuted() ? '🔇 Som desligado (tocar para ligar)' : '🔊 Som ligado (tocar para desligar)'}</button>
      <button class="btn" id="s">💾 Salvar agora</button><button class="btn" id="t">🏠 Voltar ao título</button>`);
    const r = await new Promise(res => {

  }

}

const Title = (() => {

  addEventListener('resize', resize); resize();

    // lua
    ctx2.fillStyle = '#ffeab8'; ctx2.beginPath(); ctx2.arc(w * .78, h * .16, Math.min(w, h) * .07, 0, 7); ctx2.fill();
    ctx2.fillStyle = '#e7c98c'; ctx2.beginPath(); ctx2.arc(w * .76, h * .15, Math.min(w, h) * .015, 0, 7); ctx2.fill();
    // silhueta de castelo + colinas
    ctx2.fillStyle = '#2a1a4d';
    ctx2.beginPath(); ctx2.moveTo(0, h); for (let x = 0; x <= w; x += 12) ctx2.lineTo(x, h * .86 - Math.sin(x / w * 6 + 1) * h * .04 - Math.sin(x / w * 13) * h * .015); ctx2.lineTo(w, h); ctx2.fill();
    const cx = w * .22, base = h * .86, u = Math.max(6, Math.min(w, h) * .02);
    ctx2.fillStyle = '#1a0f36';
    ctx2.fillRect(cx - u * 4, base - u * 8, u * 8, u * 8); ctx2.fillRect(cx - u * 6, base - u * 11, u * 3, u * 11); ctx2.fillRect(cx + u * 3, base - u * 11, u * 3, u * 11);
    for (const tx of [cx - u * 6, cx + u * 3]) { ctx2.beginPath(); ctx2.moveTo(tx - u * .5, base - u * 11); ctx2.lineTo(tx + u * 1.5, base - u * 14.5); ctx2.lineTo(tx + u * 3.5, base - u * 11); ctx2.fill(); }
    ctx2.fillStyle = '#ffd166'; ctx2.fillRect(cx - u * 1, base - u * 6, u * 2, u * 2.2); ctx2.fillRect(cx - u * 5.2, base - u * 8, u * 1.2, u * 1.6); ctx2.fillRect(cx + u * 4, base - u * 8, u * 1.2, u * 1.6);
    for (const hh of hearts) {
      hh.y -= hh.v * dt; if (hh.y < -.05) { hh.y = 1.05; hh.x = Math.random(); }
      const x = (hh.x + Math.sin(t + hh.p) * .02) * w, y = hh.y * h, s = hh.s;
      ctx2.fillStyle = `rgba(255,120,160,${.35 + .25 * Math.sin(t * 2 + hh.p)})`;
      ctx2.fillRect(x - s, y - s, s, s); ctx2.fillRect(x + 1, y - s, s, s); ctx2.fillRect(x - s, y, s * 2 + 1, s); ctx2.fillRect(x - s + 2, y + s, s * 2 - 3, 2); ctx2.fillRect(x - 1, y + s + 2, 3, 2);
    }
  };
  function showPress() {

    inEl.innerHTML = duoHTML() + `<div class="kicker">UMA AVENTURA FEITA COM AMOR</div><h1>A LENDA DO<em>CORAÇÃO</em></h1><div class="tag">Uma história só sua.</div><div id="tapStart">TOQUE PARA COMEÇAR</div>`;

/* ---------- créditos ---------- */
function runCredits() {
  return new Promise(resolve => {
    const root = $('credits'), sc = root.querySelector('.scroll'), end = root.querySelector('.end'), cv3 = root.querySelector('canvas');
    root.classList.add('on'); end.classList.remove('on');
    cv3.width = innerWidth; cv3.height = innerHeight;
    const c3 = cv3.getContext('2d');
    const hs = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), s: 2 + Math.random() * 5, v: .03 + Math.random() * .07, p: Math.random() * 6 }));
    const lines = [];
    lines.push(`<div class="big">${esc(T('A LENDA DE {nome}'))}</div>`);
    lines.push(`<p>Um jogo feito com amor por ${esc(T('{eu}'))}</p>`);
    for (const [a, b] of CONFIG.creditsJokes) lines.push(`<h3>${esc(T(a)).toUpperCase()}</h3><p>${esc(T(b))}</p>`);
    lines.push(`<h3>ELENCO</h3><p>${esc(T('{nome}'))} como a Heroína Destemida</p><p>${esc(T('{eu}'))} como o Príncipe Atrapalhado</p><p>Rei da Preguiça como ele mesmo (sonolento)</p><p>Gosma Gigante como a Gosma Gigante</p><p>Pombo da Praça como o Pombo da Praça</p>`);
    lines.push(`<div class="big">FIM</div><p>(mas a nossa história continua...)</p><p style="font-size:40px;margin-top:20px">💖</p>`);
    sc.innerHTML = lines.join('');
    let y = innerHeight, speed = 38, t0 = performance.now(), done = false;
    const total = () => sc.scrollHeight;
    const loop = now => {
      const dt = Math.min(.05, (now - t0) / 1000); t0 = now;
      y -= speed * dt; sc.style.transform = `translateY(${y - innerHeight}px)`;
      c3.clearRect(0, 0, cv3.width, cv3.height);
      for (const h of hs) {
        h.y -= h.v * dt; if (h.y < -.05) { h.y = 1.05; h.x = Math.random(); }
        const x = (h.x + Math.sin(now / 900 + h.p) * .02) * cv3.width, yy = h.y * cv3.height, s = h.s;
        c3.fillStyle = `rgba(255,100,150,${.28 + .2 * Math.sin(now / 400 + h.p)})`;
        c3.fillRect(x - s, yy - s, s, s); c3.fillRect(x + 1, yy - s, s, s); c3.fillRect(x - s, yy, s * 2 + 1, s); c3.fillRect(x - s + 2, yy + s, s * 2 - 3, 2); c3.fillRect(x - 1, yy + s + 2, 3, 2);
      }
      if (!done && y < -total() + innerHeight * .55) {
        done = true; speed = 0;
        end.innerHTML = `<button class="btn gold" id="cl">💌 Ler a carta</button><button class="btn" id="cb">Voltar ao mundo</button>`;
        end.classList.add('on');
        $('cl').addEventListener('click', () => showLetter());
        $('cb').addEventListener('click', () => { root.classList.remove('on'); resolve(); });
      }
      if (root.classList.contains('on')) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    root.onpointerdown = e => { if (e.target.closest('button')) return; speed = speed === 38 ? 110 : 38; if (done) speed = 0; };
  });
}

/* =====================================================================
   ENTIDADES — NPCs, objetos, puzzles, inimigos, chefões e projéteis
   ===================================================================== */
function mkEnt(o) { return Object.assign({ x: 0, y: 0, w: 16, h: 16, solid: false, dead: false, z: 0 }, o); }
const px16 = (g2, cx, cy, e, x, y, w, h, c) => px(g2, Math.round(e.x - cx + x), Math.round(e.y - cy + y), w, h, c);
function dirToPlayer(e) {
  const c = playerCenter(), dx = c.x - (e.x + e.w / 2), dy = c.y - (e.y + e.h / 2);
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
}
const playerBox = () => ({ x: P.x, y: P.y, w: P.w, h: P.h });
function shadowAt(g2, x, y, rx) { ell(g2, Math.round(x), Math.round(y), rx, 2, 'rgba(0,0,0,.25)'); }

/* ---------- NPC ---------- */
function NPC(tx, ty, name, look, interact, opts = {}) {
  const sheet = look.sheet || makeSheet(look); Portraits[name] = sheet;
  return mkEnt({
    kind: 'npc', name, sheet, x: tx * TS + 2, y: ty * TS + 4, w: 12, h: 12, solid: true, dir: opts.dir || 'down', mark: opts.mark, t: Math.random() * 6,
    interact(self) { self.dir = dirToPlayer(self); return interact(self); },
    update(dt) { this.t += dt; },
    draw(g2, cx, cy) {
      const bob = Math.sin(this.t * 2.2) > .85 ? -1 : 0;
      shadowAt(g2, this.x + 6 - cx, this.y + 11 - cy, 5);
      const fr = this.walking ? [0, 1, 0, 2][Math.floor(this.t * 9) % 4] : 0;
      const u = sheet.u || 16, hi = u === 32, px0 = hi ? Math.round((this.x - 2 - cx) * 2) / 2 : Math.round(this.x - 2 - cx), py0 = hi ? Math.round((this.y - 4 - cy + bob) * 2) / 2 : Math.round(this.y - 4 - cy + bob);
      g2.drawImage(sheet, fr * u, DIRI[this.dir] * u, u, u, px0, py0, 16, 16);
      if (this.mark && this.mark()) { g2.fillStyle = '#ffd166'; g2.fillRect(Math.round(this.x + 5 - cx), Math.round(this.y - 13 - cy + Math.sin(this.t * 5) * 1.5), 2, 5); g2.fillRect(Math.round(this.x + 5 - cx), Math.round(this.y - 6 - cy + Math.sin(this.t * 5) * 1.5), 2, 2); }
    }
  });
}

    kind: 'chest', x: tx * TS, y: tx * 0 + ty * TS + 2, w: 16, h: 13, solid: true, open: opened, z: 0,
    interact(self) {
      if (self.open) return say('', 'O baú está vazio.');

    draw(g2, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy - 1);

      if (this.open) { px(g2, x + 1, y + 1, 14, 5, '#6b4423'); px(g2, x + 2, y + 2, 12, 3, '#2a1a14'); px(g2, x + 3, y + 3, 10, 1, '#ffd166'); }
      else { px(g2, x + 1, y + 2, 14, 5, '#a8743f'); px(g2, x + 1, y + 2, 14, 1, '#d6a468'); px(g2, x + 7, y + 6, 2, 3, '#ffd166'); px(g2, x + 1, y + 9, 14, 1, '#ffd166'); px(g2, x + 1, y + 5, 14, 1, '#ffd166'); }

function Sign(tx, ty, text, who) {

function Deco(tx, ty, drawFn, o = {}) {

}

/* ---------- gatilhos ---------- */
function Warp(tx, ty, tw, th, to, dx, dy, dir, opts = {}) {
  return mkEnt({
    kind: 'warp', x: tx * TS, y: ty * TS, w: tw * TS, h: th * TS,
    trigger(e) {

        return;
      }

}
async function warpTo(map, tx, ty, dir) {

function Zone(tx, ty, tw, th, run, flag) {

/* ---------- pickups ---------- */
function makePickup(kind, x, y, o = {}) {
  return mkEnt(Object.assign({
    kind: 'pickup', pk: kind, x, y, w: 10, h: 10, t: 0, life: kind === 'heart' ? 12 : 1e9,
    update(dt) { this.t += dt; this.life -= dt; if (this.life <= 0) this.dead = true; },
    trigger(e) {
      if (e.dead) return; e.dead = true;
      if (kind === 'heart') { Snd.sfx('heart'); heal(2); burst(e.x + 5, e.y + 5, 6, ['#ff4d7d', '#ffd0de'], 30, .4); }
      else if (kind === 'key') { Snd.sfx('pickup'); S.keys++; updateHud(); toast('Chave pequena! 🔑'); }
      else if (kind === 'frag' && o.onTake) { o.onTake(); }
    },
    draw(g2, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy + Math.sin(this.t * 5) * 1.5);
      if (kind === 'heart' && this.life < 3 && Math.floor(this.life * 8) % 2 === 0) return;

      if (kind === 'heart') drawHeartShape(g2, x + 5, y + 3, 3, '#ff4d7d');

  if (dx && !blocked(e.x + dx, e.y, e.w, e.h, e)) e.x += dx;
  if (dy && !blocked(e.x, e.y + dy, e.w, e.h, e)) e.y += dy;
}

function Grid(w, h, fill) {
  const g = Array.from({ length: h }, () => Array(w).fill(fill)), keep = [];
  const o = {
    w, h, g,
    set(x, y, t) { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = t; return o; },
    get(x, y) { return (x < 0 || y < 0 || x >= w || y >= h) ? 'V' : g[y][x]; },
    rect(x, y, ww, hh, t) { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) o.set(i, j, t); return o; },
    border(t, n = 1) { for (let k = 0; k < n; k++) { o.rect(k, 0, 1, h, t); o.rect(w - 1 - k, 0, 1, h, t); o.rect(0, k, w, 1, t); o.rect(0, h - 1 - k, w, 1, t); } return o; },
    keep(x, y, ww, hh) { keep.push([x, y, ww, hh]); return o; },
    scatter(t, count, seed, on, region) {
      const r = RNG(seed), rx = region ? region[0] : 0, ry = region ? region[1] : 0, rw = region ? region[2] : w, rh = region ? region[3] : h;
      let placed = 0, tries = 0;
      while (placed < count && tries < count * 40) {
        tries++; const x = rx + Math.floor(r() * rw), y = ry + Math.floor(r() * rh);
        if (!on.includes(o.get(x, y))) continue;
        if (keep.some(k => x >= k[0] && x < k[0] + k[2] && y >= k[1] && y < k[1] + k[3])) continue;
        o.set(x, y, t); placed++;
      }
      return o;
    },
    rows() { return g.map(r => r.join('')); }
  };
  return o;
}

/* ---------- utilidades de cena ---------- */
async function walkTo(e, x, y, speed = 42) {
  e.walking = true;
  for (let i = 0; i < 2000; i++) {
    const dx = x - e.x, dy = y - e.y, d = Math.hypot(dx, dy); if (d < 1.2) break;
    e.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
    const st = Math.min(d, speed / 60); e.x += dx / d * st; e.y += dy / d * st; await sleep(16);
  }
  e.walking = false;
}
async function walkPlayer(x, y, speed = 42) {
  P.forceMove = true;
  for (let i = 0; i < 2000; i++) {
    const dx = x - P.x, dy = y - P.y, d = Math.hypot(dx, dy); if (d < 1.2) break;
    P.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
    const st = Math.min(d, speed / 60); P.x += dx / d * st; P.y += dy / d * st; await sleep(16);
  }
  P.forceMove = false;
}

    if (!arenaDone) {
      let started = false;
      ents.push(Zone(9, 31, 4, 1, async () => {
        if (started) return; started = true;
        await cutscene(async () => {
          Snd.sfx('boss'); shake(.4); gateB.open = false; gateB.solid = true; gateB.t = 0;
          await say('', 'As portas se fecharam atrás de você! Derrote todos os inimigos para abrir o caminho!');
        });
        const list = [Enemy('bat', 6, 26), Enemy('bat', 15, 26), Enemy('bat', 10, 27), Enemy('knight', 6, 29), Enemy('knight', 14, 29), Enemy('pslime', 10, 25), Enemy('pslime', 8, 28)];
        list.forEach(e => { e.noDrop = true; W.ents.push(e); });
        W.ents.push(mkEnt({ kind: 'arenactl', x: 0, y: 0, w: 1, h: 1, update() {
          if (this.done) return;
          const alive = W.ents.filter(e => e.enemy && !e.dead && !e.boss).length;
          if (alive === 0) { this.done = true; setFlag('arena_done'); Snd.sfx('fanfare'); gateB.open = true; gateB.solid = false; gateT.openIt(true); spawnPickup('key', 10 * TS + 3, 27 * TS); toast('Sala limpa! Uma chave apareceu.'); }
        } }));
      }));
    }
    // porta trancada com chave
    ents.push(LockedDoor(9, 20, 4, 'ldoor_done'));
    ents.push(CodeDoor(9, 16, 4, 'code_done'));
    // trono
    if (!hasFlag('king_done')) {
      const boss = Rei(10, 4);
      ents.push(boss);
      ents.push(Zone(9, 12, 4, 1, async () => {
        await startBoss(boss, [
          ['Rei da Preguiça', 'Zzz... hã? Quem é? Ah, uma heroína... Que preguiça de lutar. Volta amanhã.'],
          ['{nome}', 'Você roubou o Coração do Reino!'],
          ['Rei da Preguiça', 'Roubei MESMO. E fiz isso porque... ah, deixa pra lá, é muito esforço explicar. Vamos lutar logo para eu voltar a dormir.'],
          ['{nome}', 'Preparada! Que o amor me guie.']
        ]);
      }));
    } else ents.push(Portal(17, 10, 'vila', 11, 25, 'up'));
    return { w: 22, h: 47, grid: gr.rows(), ents };
  }
};

/* ---------- FINAL ---------- */
async function endingScene() {
  Snd.music('ending');
  const rei = NPC(10, 5, 'Rei da Preguiça', LOOK.rei(), () => {}, { dir: 'down' });
  rei.x = 10 * TS + 2; rei.y = 4 * TS + 4; W.ents.push(rei);
  await sleep(600);
  await say('Rei da Preguiça', ['Ai ai... eu perdi. E olha que eu só queria uma sonequinha.', 'Quer saber por que roubei o Coração do Reino? Porque ninguém nunca me acordou com carinho. Todo mundo só sabe cobrar.']);
  await say('{nome}', 'Que triste... mas isso não justifica roubar um coração!');
  await say('Rei da Preguiça', ['Justo. Aqui está o Coração do Reino. E um conselho de quem já dormiu muito: quando achar alguém que te faz acordar feliz, não deixe ir embora.']);
  const heart = mkEnt({ kind: 'deco', x: 10 * TS + 2, y: 8 * TS, w: 12, h: 12, t: 0, z: 2, update(dt) { this.t += dt; }, draw(g2, cx, cy) { const x = Math.round(this.x - cx + 6), y = Math.round(this.y - cy + Math.sin(this.t * 3) * 2); g2.globalAlpha = .4; disc(g2, x, y + 2, 14, '#ff8fb0'); g2.globalAlpha = 1; drawHeartShape(g2, x, y, 5, '#ff4d7d'); drawHeartShape(g2, x, y - 1, 2, '#ffd0de'); } });
  W.ents.push(heart);
  Snd.sfx('heart'); flash('#ffd0e0', .5);
  await say('', ['O Coração do Reino flutuou até você e brilhou forte!', 'O reino inteiro vibrou de alegria. As flores desabrocharam, as gosmas dançaram e até o pombo da praça chorou.']);
  heart.dead = true;
  await say('Rei da Preguiça', ['Mas olha só... acho que alguém chegou. Eu vou fingir que não vi e voltar a dormir. Zzz...']);
  // O parceiro entra
  const you = NPC(10, 14, 'Seu Amor', LOOK.vc(), () => {}, { dir: 'up' }); you.name = T('{eu}'); Portraits[T('{eu}')] = Art.youPortrait || you.sheet;
  you.x = 10 * TS + 2; you.y = 15 * TS; W.ents.push(you);
  await walkTo(you, 10 * TS + 2, 8 * TS + 4, 34);
  await walkPlayer(10 * TS - 3, 6 * TS, 34); P.dir = 'down';
  you.dir = 'up'; P.dir = 'down';
  await sleep(400);
  await say('{eu}', ['Cheguei! Ia te salvar, mas pelo visto você já derrotou um rei, uma gosma, um caranguejo ciumento e um fantasma. Sem mim.', 'Eu ia chegar mais cedo, mas o GPS do reino me mandou pra montanha. Duas vezes.']);
  await say('{nome}', 'Eu desconfiei que era você desde a carta. A letra era a mesma da lista de compras!');
  await say('{eu}', ['Descobriu... Mas ó, eu fiz tudo isso por um motivo.', 'Cada fase, cada fantasma e cada puzzle foi uma desculpa para uma coisa só: te dizer o quanto você é importante pra mim.']);
  await say('{eu}', ['Você me faz rir quando eu mais preciso, me acalma quando tudo está uma bagunça, e deixa até segunda-feira mais bonita.', 'Eu escrevi uma carta pra você. Não é a do Rei. É a minha.']);
  await showLetter();
  await say('{eu}', 'Então eu queria te perguntar uma coisa. Mas antes, só um aviso: existem dois botões. Um deles é o correto.');
  Snd.music('ending');
  const yes = await proposalModal();
  if (yes) {
    Snd.sfx('love'); flash('#ffd0e0', .7);
    for (let i = 0; i < 40; i++) fx({ x: cam.x + rnd(0, VW), y: cam.y + VH + 4, vx: rnd(-10, 10), vy: -rnd(25, 60), life: rnd(2, 4), kind: 'heart', size: 2 + ((Math.random() * 2) | 0), color: ['#ff4d7d', '#ff8fb0', '#ffd0de'][i % 3] });
    shake(.3);
    await say('{eu}', ['Ela disse SIM! 🎉', 'Meu coração fez mais barulho do que o Rei da Preguiça acordando.']);
    await say('{nome}', ['Claro que sim, bobo. Desde o começo o único final que eu queria era esse.', 'Mas se o "Não" voltar, eu cuido dele.']);
    await say('Rei da Preguiça', '(do canto, dormindo) ...zzz... que lindo... zzz... eu quero ser padrinho... zzz...');
    await say('', ['E assim, {nome} e {eu} viveram felizes para sempre...', 'Ou pelo menos até a próxima aventura.', 'FIM.']);
  }
  setFlag('final_done');
  await runCredits();
  await showCoupon();
  Snd.music('castelo');
  await say('', 'Você zerou o jogo! O mundo continua aberto, caso queira explorar mais. 💖');
  Snd.music('ending');
}
async function showCoupon() {
  const M = openModal(`<h2>🎁 PRÊMIO FINAL</h2><div style="background:linear-gradient(135deg,#ffe9a8,#ffb3c8);color:#3b2a22;border-radius:8px;padding:18px 14px;text-align:center;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #e0345f"><div style="font-family:var(--font-display);font-size:10px;line-height:1.7;margin-bottom:10px">CUPOM DO AMOR</div><div style="font-size:21px;font-weight:700;line-height:1.3">${esc(T(CONFIG.coupon))}</div><div style="margin-top:12px;font-size:15px">Válido para sempre. Assinado: ${esc(T('{eu}'))} 💌</div></div><button class="btn pri" id="ok">Resgatar com um abraço</button>`);
  M.card.querySelector('#ok').addEventListener('click', () => { Snd.sfx('love'); M.close(); });
  return M.p;
}

requestAnimationFrame(frame);
